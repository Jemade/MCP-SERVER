[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-workspace-mcp"
version = "1.0.0"
description = "A local MCP server for tasks, read-only SQLite analytics and weather"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
personal-mcp = "personal_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
